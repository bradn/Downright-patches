# Authored by Claude Code as directed by Brad Nicholas <70774+bradn@users.noreply.github.com>
# The read-only Downright app for iPhone and iPad (iOS port, phase 3).
# Kept out of the root project.yml so the Mac release pipeline is untouched.
#   xcodegen generate   (in this directory)
name: DownrightIOS
options:
  deploymentTarget:
    iOS: "17.0"
# Team and bundle prefix come from Signing.xcconfig (placeholders) and your
# own git-ignored Signing.local.xcconfig, pulled in by an optional `#include?`.
# Not listed here directly: XcodeGen rejects a missing config file, and most
# builders won't have one.  The reasoning is in Signing.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  Downright:
    path: ..
targets:
  DownrightIOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Downright
        product: MarkdownCore
      - package: Downright
        product: MarkdownRender
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Downright
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        # A "Downright" folder under On My iPhone / On My iPad, for files kept
        # with the app.
        UIFileSharingEnabled: true
        NSUserActivityTypes:
          # Must match ReadingState.activityType (bundle ID + ".reading").
          - $(PRODUCT_BUNDLE_IDENTIFIER).reading
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mkdn
              public.mime-type:
                - text/markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOWNRIGHT_BUNDLE_PREFIX).downright.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # Overridden from Config/version.env by Scripts/check-ios.sh and any
        # other caller that passes MARKETING_VERSION / CURRENT_PROJECT_VERSION.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  DownrightIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DownrightIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DOWNRIGHT_BUNDLE_PREFIX).downright.ios.tests
        SWIFT_VERSION: "5.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DownrightIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DownrightIOS
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DownrightIOS:
    build:
      targets:
        DownrightIOS: all
        DownrightIOSTests: [test]
    test:
      targets:
        - DownrightIOSTests
